<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SacaCuenta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d3040">
<style>
/* Paleta: atardecer naranja sobre azul oscuro de montaña, con fondo crema.
   Layout: una sola pantalla de teléfono. Tarjeta de ganancia arriba, productos con foto en cuadrícula,
   barra de cobro y navegación con iconos abajo. El movimiento es corto y solo confirma lo que se tocó. */
:root{
  --bg:#faf5ee; --surface:#ffffff; --ink:#172531; --muted:#667079; --line:#ece2d6;
  --accent:#dd5a12; --accent-ink:#ffffff; --accent-soft:#fde6d3;
  --warn:#24496b; --warn-soft:#e0e8ef; --bad:#b3261e; --bad-soft:#f9dfdc;
  --navy:#1d3040; --navy-ink:#fbf3ea; --glow:#f58a3c; --tile:#f6eee4;
  /* Vidrio: paneles translúcidos sobre luces de color */
  --i1:#f58a3c; --i2:#dd5a12; --i3:#ffffff; --i4:#1d3040;
  --glass:linear-gradient(135deg,rgba(221,90,18,.20),rgba(221,90,18,.06));
  --glass-line:rgba(255,255,255,.72); --glass-ink:#172531; --glass-sub:rgba(23,37,49,.72);
  --glass-nav:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.52));
  --glass-shadow:0 10px 30px rgba(23,37,49,.16);
  --luz:radial-gradient(300px 260px at 12% 6%,rgba(245,138,60,.42),transparent 72%),
        radial-gradient(340px 300px at 102% 28%,rgba(70,140,200,.26),transparent 72%),
        radial-gradient(360px 300px at 18% 96%,rgba(245,138,60,.34),transparent 72%),
        radial-gradient(300px 260px at 96% 92%,rgba(90,110,190,.20),transparent 72%);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1820; --surface:#19262f; --ink:#f4ece3; --muted:#9aa5ae; --line:#2b3a46;
    --accent:#f58a3c; --accent-ink:#22120a; --accent-soft:#3b2616;
    --warn:#a9c4dc; --warn-soft:#22384b; --bad:#f08a80; --bad-soft:#3d1c19; --navy:#24394b; --navy-ink:#fbf3ea; --glow:#f9a25e; --tile:#22313c;
    --i1:#f9a25e; --i2:#e0691f; --i3:#ffffff; --i4:#0b1218;
    --glass:linear-gradient(135deg,rgba(245,138,60,.34),rgba(245,138,60,.10));
    --glass-line:rgba(255,255,255,.22); --glass-ink:#ffffff; --glass-sub:#fbe9da;
    --glass-nav:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
    --glass-shadow:0 10px 30px rgba(0,0,0,.42);
    --luz:radial-gradient(300px 260px at 12% 6%,rgba(245,138,60,.95),transparent 72%),
          radial-gradient(340px 300px at 102% 28%,rgba(70,140,200,.85),transparent 72%),
          radial-gradient(360px 300px at 18% 96%,rgba(245,138,60,.80),transparent 72%),
          radial-gradient(300px 260px at 96% 92%,rgba(90,110,190,.60),transparent 72%);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1820; --surface:#19262f; --ink:#f4ece3; --muted:#9aa5ae; --line:#2b3a46;
  --accent:#f58a3c; --accent-ink:#22120a; --accent-soft:#3b2616;
  --warn:#a9c4dc; --warn-soft:#22384b; --bad:#f08a80; --bad-soft:#3d1c19; --navy:#24394b; --navy-ink:#fbf3ea; --glow:#f9a25e; --tile:#22313c;
    --i1:#f9a25e; --i2:#e0691f; --i3:#ffffff; --i4:#0b1218;
    --glass:linear-gradient(135deg,rgba(245,138,60,.34),rgba(245,138,60,.10));
    --glass-line:rgba(255,255,255,.22); --glass-ink:#ffffff; --glass-sub:#fbe9da;
    --glass-nav:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
    --glass-shadow:0 10px 30px rgba(0,0,0,.42);
    --luz:radial-gradient(300px 260px at 12% 6%,rgba(245,138,60,.95),transparent 72%),
          radial-gradient(340px 300px at 102% 28%,rgba(70,140,200,.85),transparent 72%),
          radial-gradient(360px 300px at 18% 96%,rgba(245,138,60,.80),transparent 72%),
          radial-gradient(300px 260px at 96% 92%,rgba(90,110,190,.60),transparent 72%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--luz),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;
  display:flex;flex-direction:column;max-width:560px;margin:0 auto;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px}
header h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.01em}
header h1 .hl{color:var(--accent)}
.rate{padding:8px 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:700;transition:transform .15s var(--ease)}
.rate:active{transform:scale(.95)}
.rate.pend{background:var(--warn-soft);color:var(--warn);animation:nudge 1.6s var(--ease) 2}
main{flex:1;overflow-y:auto;padding:10px 16px 20px;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
.fxcta{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--accent-soft);border-color:transparent}
.fxcta b{display:block}.fxcta small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.fxico{width:44px;height:44px;border-radius:14px;background:var(--surface);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.fxshots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fxshot{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.fxshot img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.fxshot small{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:var(--surface);padding:2px 7px;border-radius:999px}
.fxshot button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--surface);font-size:20px;line-height:1;color:var(--bad)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
p.bad,.fxinfo .bad{color:var(--bad)}
.fxwait{text-align:center;align-items:center}
.fxempty{grid-column:1/-1}
.fxl{display:flex;flex-direction:column;gap:8px;transition:opacity .2s}
.fxl.off{opacity:.5}.fxl.off .fxbody{display:none}
.fxtop{display:flex;align-items:center;gap:10px}
.fxtop input[type=checkbox]{width:24px;height:24px;flex-shrink:0;accent-color:var(--accent);margin:0}
.fxname{font-weight:700;padding:9px 10px}
.fxbody{display:flex;flex-direction:column;gap:8px}
.fx3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.fx3 label,.fxup{font-size:12px}
input.need{border-color:var(--bad);background:var(--bad-soft)}
.fxinfo{margin:0;font-size:14px;line-height:1.45}

nav{display:flex;padding:8px 4px 10px;margin:0 12px calc(12px + env(safe-area-inset-bottom,0px));border-radius:28px;background-image:var(--glass-nav)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:650;color:var(--ink);opacity:.6}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .ic{padding:4px 12px;border-radius:999px;display:flex;transition:background .25s var(--ease),transform .25s var(--ease)}
nav button.on{color:var(--ink);opacity:1}
nav button.on .ic{background:var(--accent);color:var(--accent-ink);transform:translateY(-1px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:12px;margin:0;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.gain{color:var(--accent)} .loss{color:var(--bad)}
.glass,.hero,nav,.cartbar{background-image:var(--glass);background-color:transparent;border:1px solid var(--glass-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--glass-shadow);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,.hero{background-color:var(--navy)}
  nav,.cartbar{background-image:none;background-color:var(--surface)}
}
.hero{color:var(--glass-ink);border-radius:22px;padding:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.hero span{font-size:13px;font-weight:600;color:var(--glass-sub)}
.hero .big{color:var(--glass-ink)}
.hero .big{display:block;margin:2px 0 4px}
.hero .bars{width:104px;height:52px;flex:none;color:var(--glow)}
.hero .bar i{opacity:.4}.hero .bar.now i{opacity:1}
.big{font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.bars{display:flex;align-items:stretch;gap:5px;height:120px;color:var(--accent)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.bar .col{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end}
.bar i{display:block;width:100%;border-radius:5px;background:currentColor;opacity:.3;transform-origin:bottom}
.bar.now i{opacity:1}
.bar.neg i{background:var(--bad)}
.bar span{font-size:12px;color:var(--muted);font-weight:600}
.bar.now span{color:var(--ink)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
#q,#mq{border-radius:999px;padding-left:18px;background:var(--tile);border-color:transparent}
label{font-size:13px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.prod{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;
  display:flex;flex-direction:column;transition:transform .12s var(--ease),border-color .2s;content-visibility:auto;contain-intrinsic-size:auto 150px}
.prod:active{transform:scale(.96)}
.prod.in{border-color:var(--accent)}
.ph{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;width:100%;overflow:hidden;background:var(--tile)}
.ph.t0{background:var(--accent-soft)}.ph.t1{background:var(--warn-soft)}.ph.t2{background:var(--tile)}.ph.t3{background:color-mix(in srgb,var(--navy) 16%,var(--surface))}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph b{font-size:30px;font-weight:800;opacity:.75}
.prod .tx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.prod .pn{font-size:14px;font-weight:650;overflow-wrap:anywhere;line-height:1.2}
.prod .pp{font-size:13px;color:var(--accent);font-weight:700}
.prod.varios{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.prod.varios .ph{background:transparent}
.badge{position:absolute;top:6px;right:6px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--accent);
  color:var(--accent-ink);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mini{width:44px;height:44px;border-radius:10px;flex:none;aspect-ratio:auto}
.mini b{font-size:18px}
.cartbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;margin:0 12px 8px;border-radius:22px;background-image:var(--glass-nav)}
.cartbar[hidden]{display:none}
.cartbar.show{animation:slideup .28s var(--ease)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:13px 20px;border-radius:999px;text-align:center;transition:transform .12s var(--ease);text-decoration:none}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.link{color:var(--accent);font-weight:600;padding:8px 0;text-decoration:underline;text-align:left}
.link.bad{color:var(--bad)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item small{display:block;color:var(--muted);font-size:13px}
.item .l{display:flex;align-items:center;gap:10px;min-width:0}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;font-size:14px;font-weight:650;color:var(--muted);border-radius:9px;transition:background .2s var(--ease),color .2s}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.banner{background:var(--navy);color:var(--navy-ink);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.banner .btn{background:transparent;color:var(--navy-ink);box-shadow:inset 0 0 0 2px var(--navy-ink);padding:9px 14px;flex:none}
.ph .pi{width:46px;height:46px;display:block}
.mini .pi{width:26px;height:26px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;text-align:center}
.empty .pi{width:44px;height:44px;opacity:.75}
.icogrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.icogrid button{aspect-ratio:1;border-radius:14px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.icogrid button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.icogrid .pi{width:34px;height:34px}
.mesa .pi{width:26px;height:26px;margin-bottom:2px}
.grid.big{grid-template-columns:repeat(2,1fr)}.grid.big .pn{font-size:16px}.grid.big .pp{font-size:15px}
.bars{justify-content:center}.bar{max-width:56px}
.grid.big .ph{aspect-ratio:16/10}
.chips button:disabled{opacity:.4;text-decoration:line-through}
.chips button.on{background:var(--accent);color:var(--accent-ink)}
.chips.cats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.chips.cats button{flex:none}
.qp.two2{grid-template-columns:1fr 1fr}
.mesas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mesa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s var(--ease)}
.mesa:active{transform:scale(.96)}.mesa span{color:var(--muted);font-size:14px}.mesa small{color:var(--muted);font-size:12px}
.mesa.occ{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}.mesa.occ span{color:var(--glow);font-weight:800;font-size:16px}.mesa.occ small{color:var(--navy-ink);opacity:.75}
.item .grow{flex:1;text-align:left}.btn.sm{padding:9px 14px;font-size:14px;flex:none}
.ph b.tn{font-size:14px;opacity:1}
.grid.rows{grid-template-columns:1fr}
.grid.rows .prod{flex-direction:row;align-items:center}
.grid.rows .prod .ph{width:92px;flex:none;align-self:stretch;aspect-ratio:auto;min-height:72px}
.grid.rows .prod .tx{padding:10px 44px 10px 12px;flex:1}.grid.rows .pn{font-size:16px}
.grid.rows .badge{top:50%;right:10px;margin-top:-13px}
.cartbar.quick{flex-direction:column;align-items:stretch}
.qp{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px}.qp .btn{padding:13px 6px}
.st{font-size:12px;font-weight:700;color:var(--muted)}.st.low{color:var(--warn)}.st.out{color:var(--bad)}
.icos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icos button{font-size:24px;padding:8px 0;border-radius:12px;background:var(--tile)}.icos button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.ingrow{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;align-items:center}
.ingrow button{height:40px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:20px;font-weight:700}
.chips{align-items:center}
.auth{display:flex;flex-direction:column;gap:16px;padding:18px 2px 8px;max-width:420px;margin:0 auto;width:100%}
.auth .brand{font-size:34px;font-weight:800;letter-spacing:-.02em;text-align:center}
.auth .brand span{color:var(--accent)}
.auth .tag{text-align:center;color:var(--muted);margin-top:-10px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:700;padding:13px 18px;border-radius:999px}
.gbtn svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px}
.ok{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:14px}
#trialbar{margin:0 16px;padding:8px 12px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
#trialbar[hidden]{display:none}
#trialbar button{font-weight:800;text-decoration:underline;color:inherit}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp .8s linear infinite;margin:40px auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.paybox{display:flex;flex-direction:column;gap:2px}
.paybox .kv b{user-select:all}
.pill.ok2{background:var(--accent);color:var(--accent-ink)}
.pill.hot{background:var(--accent);color:var(--accent-ink)}.pill.late{background:var(--bad-soft);color:var(--bad)}
.rb{display:flex;align-items:center;gap:12px;width:100%;padding:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:transform .12s var(--ease),border-color .2s}
.rb:active{transform:scale(.98)}.rb.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.rb.soon{opacity:.55;cursor:default}
.rb .ri{width:48px;height:48px;flex:none;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.rb.soon .ri{background:var(--tile);color:var(--muted)}
.rb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb .rt{flex:1;min-width:0}.rb small{display:block;color:var(--muted);font-size:13px}
.hero .btn{background:var(--glow);color:#22120a;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:9px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px 22px;
  display:flex;flex-direction:column;gap:12px;animation:slideup .3s var(--ease)}
.sheet.still{animation:none}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paygrid .warn{grid-column:1/-1}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:20px;font-weight:700}
.qty b{min-width:24px;text-align:center}
.mixrow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center}
.mixrow span{font-size:14px;font-weight:600}
.mixrow button{font-size:13px;color:var(--accent);font-weight:700;padding:8px 4px}
.photo{display:flex;align-items:center;gap:12px}
.photo .ph{width:104px;border-radius:12px;flex:none}
.filebtn{position:relative;overflow:hidden;display:inline-flex;flex-direction:row;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;padding:0;border:0}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;
  font-size:14px;font-weight:600;z-index:20;max-width:90%;text-align:center;animation:fade .2s}
.toast[hidden]{display:none}
.done{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;
  background:color-mix(in srgb,var(--bg) 96%,transparent);animation:fade .18s}
.done[hidden]{display:none}
.done svg{width:92px;height:92px;fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.done circle{stroke-dasharray:145;stroke-dashoffset:145;animation:draw .45s var(--ease) forwards}
.done path{stroke-dasharray:36;stroke-dashoffset:36;animation:draw .3s var(--ease) .35s forwards}
.done b{font-size:20px}.done span{font-size:26px;font-weight:800;color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
main.enter>*{animation:rise .34s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.04s} main.enter>*:nth-child(3){animation-delay:.08s}
main.enter>*:nth-child(4){animation-delay:.12s} main.enter>*:nth-child(n+5){animation-delay:.16s}
main.enter .prod{animation:rise .32s var(--ease) both;animation-delay:calc(.1s + var(--i,0)*28ms)}
main.enter .bar i{animation:grow .55s var(--ease) both;animation-delay:calc(.12s + var(--i,0)*45ms)}
.prod.hit{animation:pop .26s var(--ease)}
.prod.hit .badge{animation:bump .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes nudge{0%,100%{transform:none}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}

const icoSvg = (id, cls) => ICO[id] ? `<svg class="pi ${cls || ''}" viewBox="0 0 48 48" aria-hidden="true">${ICO[id][3]}</svg>` : '';
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
let icoIx = null;
function icoIndex(){
  if (icoIx) return icoIx;
  const words = new Map(), phrases = [];
  for (const id in ICO){
    const ws = norm(ICO[id][2]).split(' ').filter(Boolean);
    ws.forEach((w, i) => { if (i === 0 || !words.has(w)) words.set(w, id); });
    for (const ph of [norm(id), norm(ICO[id][1])]) if (ph.includes(' ')) phrases.push([ph, id]);
  }
  phrases.sort((a, b) => b[0].length - a[0].length);
  icoIx = {words, phrases};
  return icoIx;
}
function guessIco(name){
  const {words, phrases} = icoIndex(), n = ' ' + norm(name) + ' ';
  for (const [ph, id] of phrases) if (n.includes(' ' + ph + ' ')) return id;
  const ws = n.trim().split(' ');
  for (const w of ws) if (words.has(w)) return words.get(w);
  for (const w of ws){ const r = w.replace(/(es|s)$/, ''); if (r.length > 3 && words.has(r)) return words.get(r); }
  return '';
}
const prodIco = p => (p.ico && ICO[p.ico]) ? p.ico : (p.ico ? '' : guessIco(p.name));

function openDB(){
  return new Promise((res, rej) => {
    try {
      const rq = indexedDB.open('mibodega', 4);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath: s === 'meta' ? 'key' : 'id'}); });
      };
      rq.onsuccess = () => { rq.result.onversionchange = () => { try { rq.result.close(); } catch (e) {} idb = null; blocked = true; render(); }; res(rq.result); };
      rq.onblocked = () => rej(new Error('blocked'));
      rq.onerror = () => rej(rq.error);
    } catch (e) { rej(e); }
  });
}
function getAll(store){
  return new Promise((res, rej) => {
    const rq = idb.transaction(store).objectStore(store).getAll();
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);

function stats(from, to){
  const sales = S.sales.filter(s => s.ts >= from && s.ts < to);
  let vend = 0, cost = 0, est = 0, fiado = 0; const by = {}, prod = {};
  for (const s of sales){
    vend += s.total; cost += s.cost;
    for (const l of s.items){
      const g = (l.price - l.cost) * l.qty;
      if (!l.pid && !l.svc) est += g;
      const k = l.pid || (l.svc ? 'svc' : 'varios');
      prod[k] = prod[k] || {name:l.name, unit:l.unit, qty:0, g:0};
      prod[k].qty += l.qty; prod[k].g += g;
    }
    for (const p of s.pays){ if (p.m === 'fiado') fiado += p.usd; else addBy(by, p.m, p.usd, s.rate); }
  }
  let nPed = 0, abPed = 0;
  for (const o of S.orders){
    if (o.status === 'entregado' && o.deliveredTs >= from && o.deliveredTs < to){
      nPed++; vend += o.total; cost += o.cost;
      for (const l of o.items){
        const g = (l.price - l.cost) * l.qty;
        if (!l.pid && !l.svc) est += g;
        const k = l.pid || (l.svc ? 'svc' : 'varios');
        prod[k] = prod[k] || {name:l.name, unit:l.unit, qty:0, g:0};
        prod[k].qty += l.qty; prod[k].g += g;
      }
    }
    for (const p of o.pagos) if (p.ts >= from && p.ts < to){ abPed += p.usd; addBy(by, p.m, p.usd, p.rate); }
  }
  let ab = 0;
  for (const a of S.abonos) if (a.ts >= from && a.ts < to){ ab += a.usd; addBy(by, a.m, a.usd, a.rate); }
  const gastos = S.expenses.filter(e => e.ts >= from && e.ts < to).reduce((t, e) => t + e.usd, 0);
  return {n:sales.length + nPed, nPed, abPed:r2(abPed), vend:r2(vend), cost:r2(cost), bruta:r2(vend - cost), gastos:r2(gastos), neta:r2(vend - cost - gastos),
          est:r2(est), fiado:r2(fiado), abonos:r2(ab), by, prod, sales};
}

const FX_MES = 40, FX_FOTOS = 6, FX_FORMS = ['bodega', 'simple', 'stock', 'ropa'];
const CUR_N = {USD:'dólares', VES:'bolívares', COP:'pesos', EUR:'euros'}, CUR_S = {USD:'$', VES:'Bs', COP:'COP', EUR:'€'};

const fxUsed = () => S.meta.fxm === fxMonth() ? (S.meta.fxn || 0) : 0;

function fxTokens(s){

    .replace(/(\d)\s*(ml|cc)\b/g, '$1ml').replace(/(\d)\s+(\d)/g, '$1.$2') + ' ';

function fxCands(l){

    else {

      if (!hit) continue;

async function fxRead(){
  if (!FX.fotos.length) return;

  if (!window.SCloud || !SCloud.readInvoice || acctState !== 'in'){ FX.err = 'Entra con tu cuenta para usar el lector de facturas.'; return render(); }
  if (fxUsed() >= FX_MES){ FX.err = 'Ya usaste las lecturas de este mes.'; return render(); }
  FX.step = 'leyendo'; FX.err = ''; render();
  const msgs = ['Buscando los productos…', 'Leyendo cantidades y precios…', 'Viendo cuántas unidades trae cada bulto…', 'Sacando el costo de cada unidad…', 'Ya casi…'];
  let k = 0; clearInterval(fxTimer); fxTimer = setInterval(() => { const e = $('#fxMsg'); if (e && k < msgs.length - 1) e.textContent = msgs[++k]; }, 6000);

    S.meta.fxm = fxMonth(); S.meta.fxn = fxUsed() + 1; saveMeta();

    if (res.legible === false || !(res.items || []).length) throw new Error('No se pudieron leer los productos. Prueba con más luz, de frente y sin que se corte ninguna línea.');
    fxSetup(res);

    FX.step = 'revisar';
  } catch (e) { FX.step = 'fotos'; FX.err = e.message || 'No se pudo leer la factura.'; }

function fxSave(){
  const on = FX.lines.filter(l => l.on), R = fxRates(), prov = (FX.res.proveedor || '').trim(), k = feat().form;
  if (on.some(l => fxIssues(l, fxCalc(l, R)).length)) return toast('A algún producto le falta un dato.');
  let nNew = 0, nUpd = 0, noVar = 0;
  for (const l of on){
    const c = fxCalc(l, R), kg = l.emp === 'kg', cu = r2(c.cu), units = kg ? r2(c.units) : Math.round(c.units);
    let p = l.pid ? S.products.find(p => p.id === l.pid) : null;
    if (!p){ p = {id:uid(), name:l.name.trim().slice(0, 80), cost:cu, price:r2(l.price)}; if (kg) p.unit = 'kg'; S.products.push(p); nNew++; }
    else {
      const avg = FX.addStock && tracked(p) && p.stock > 0 && !p.vars ? r2((p.stock * p.cost + units * cu) / (p.stock + units)) : cu;
      p.cost = avg; p.price = r2(l.price); delete p.est; delete p.ex; nUpd++;
    }
    if (k === 'stock') p.base = Math.max(0, r2(p.cost - (p.extra || 0)));
    if (k === 'bodega' && c.pack > 0) p.bulto = {c:r2(c.pack), n:l.n};
    if (l.codigo) p.cod = l.codigo;
    const raw = norm(l.texto); if (raw) p.fx = [raw, ...(p.fx || []).filter(x => x !== raw)].slice(0, 3);
    if (FX.addStock && units > 0){
      const why = 'Factura' + (prov ? ' ' + prov.slice(0, 30) : '');
      if (p.vars && p.vars.length) noVar++;
      else if (tracked(p)){ const b = p.stock; p.stock = r2(b + units); logMove(p, 'in', units, b, p.stock, {why}); }
      else { p.stock = units; if (p.min == null) p.min = 0; logMove(p, 'inicio', units, null, units, {why}); }
    }
    put('products', p);
  }
  FX = null; view = 'inventario'; invSeg = 'todos'; invQ = ''; render(true); $('#main').scrollTop = 0;
  done('Factura cargada', [nNew ? nNew + (nNew === 1 ? ' nuevo' : ' nuevos') : '', nUpd ? nUpd + (nUpd === 1 ? ' actualizado' : ' actualizados') : ''].filter(Boolean).join(' · '));
  if (noVar) setTimeout(() => toast('Los productos con tallas o colores no se sumaron al inventario. Anótalos en cada variante.'), 1700);
  else if (S.products.some(p => p.ex && !p.off)) setTimeout(() => ask('Ya tienes tus productos. ¿Borrar los de ejemplo que traía la app?', 'Borrar ejemplos', () => {
    S.products.filter(p => p.ex).forEach(p => del('products', p.id)); S.products = S.products.filter(p => !p.ex); cart = cart.filter(l => !l.pid || S.products.some(p => p.id === l.pid)); render(); }), 1700);
}

    const tot = sheetIngs.reduce((t, x) => t + num(x.c), 0); c.disabled = tot > 0;

function fileToThumb(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      try {
        const W = 360, H = 270, c = document.createElement('canvas'); c.width = W; c.height = H;
        const s = Math.max(W / im.width, H / im.height), w = im.width * s, h = im.height * s;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
        res(c.toDataURL('image/jpeg', 0.72));
      } catch (e) { rej(e); } finally { URL.revokeObjectURL(url); }
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}

  const ab = [];

      await Share.share({title, url:f.uri});

    return;
  }

    a.href = URL.createObjectURL(new Blob([text], {type:mime}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast('Si no se descargó, usa el botón de copiar.');

async function backupNow(manual){

  if (!navigator.onLine){ if (manual) toast('Sin internet. El respaldo se hará cuando te conectes.'); return; }

    if (ACC.dev && manual !== 'force'){
      const info = await SCloud.backupInfo();

        ACC.conflict = info.ts; putAcct();
        if (manual) ask('Otro equipo respaldó esta cuenta el ' + fDate(info.ts) + '. Si respaldas desde aquí, ese respaldo se reemplaza por lo que hay en este equipo.', 'Reemplazarlo', () => backupNow('force'));
        return;

    }
    const {data, photos, summary} = backupPayload(); summary.dev = ACC.dev || '';
    const r = await SCloud.backup(data, photos, ACC.sent || {}, summary);
    ACC.sent = r.sent; ACC.lastBackup = Date.now(); ACC.dirty = false; delete ACC.conflict; ACC.maxSeen = Math.max(ACC.maxSeen || 0, nowSafe()); putAcct();

    else if (was && !ok){ if (!['resumen', 'mas', 'paywall', 'admin'].includes(view)) view = 'paywall'; render(true); }

function startCloud(){

  try { SCloud.init(CFG.firebase, {emulator:CFG.emulator}); } catch (e) { acctState = 'error'; return; }
  if (ACC.uid && !ACC.out) acctState = 'in';
  SCloud.onUser(u => {
    if (!u){ if (acctState !== 'out'){ acctState = 'out'; render(); } return; }
    if (acctState === 'in' && ACC.uid === u.uid){ refreshAcct(true).then(() => { if (view === 'paywall' || view === 'mas') render(); }); return; }
    afterLogin();

  bulk(){
    const F = {
      bodega:['nombre; costo; precio. Agrega ; kg al final si se vende por peso.', 'Harina de maíz 1 kg; 1,10; 1,40&#10;Queso blanco; 5,50; 7,00; kg'],
      simple:['nombre; precio; costo. El costo es opcional.', 'Empanada; 1,00; 0,50&#10;Café; 0,50'],
      ropa:['nombre; costo; precio; existencia. Las tallas y colores se ponen después, prenda por prenda.', 'Gorra; 3,00; 7,00; 10&#10;Correa; 4,00; 9,00; 6'],
      stock:['nombre; costo; precio; existencia. La existencia es opcional.', 'Franela estampada; 5,00; 10,00; 12&#10;Llavero; 0,80; 2,00; 30'],
      plato:['nombre; costo; precio; categoría. La categoría es opcional.', 'Hamburguesa clásica; 2,50; 5,00; Hamburguesas&#10;Refresco; 0,60; 1,20; Bebidas'],
      receta:['nombre; costo; precio; días de anticipación. Los días son opcionales.', 'Tequeños x 50; 7,00; 11,70; 2&#10;Torta de vainilla 1 kg; 8,00; 15,00; 3']
    }[feat().form];
    openSheet(`<h2>Cargar varios productos</h2>
      <p class="muted">Un producto por línea: ${F[0]} También puedes pegar filas copiadas de Excel.</p>
      <label>Lista<textarea id="bulkTxt" rows="9" placeholder="${F[1]}"></textarea></label>
      <p class="muted">Si un nombre ya existe, se actualizan sus datos. ${feat().form === 'receta' ? 'Las recetas y las fotos' : 'Las fotos'} se ponen después, producto por producto.</p>
      <button class="btn block" data-act="bulkadd">Cargar productos</button>
      <button class="btn ghost block" data-act="close">Cancelar</button>`);
  },
  bulkadd(){
    let add = 0, upd = 0, bad = 0; const k = feat().form;
    for (const line of $('#bulkTxt').value.split(/\r?\n/)){
      if (!line.trim()) continue;
      const c = line.split(/\t|;/).map(x => x.trim()), name = c[0], x4 = c[3] || '';
      let cost = num(c[1]), price = num(c[2]), est = false;
      if (k === 'simple'){ price = num(c[1]); cost = num(c[2]); if (!cost && price){ cost = r2(price * (1 - S.meta.variosMargin / 100)); est = true; } }
      if (!name || !price){ bad++; continue; }
      let p = S.products.find(p => !p.off && p.name.toLowerCase() === name.toLowerCase());
      if (p){ p.cost = cost; p.price = price; delete p.ex; upd++; } else { p = {id:uid(), name, cost, price}; S.products.push(p); add++; }
      if (est) p.est = true; else delete p.est;
      if (k === 'bodega'){ if (/^(kg|kilo|kilos|peso)$/i.test(x4)) p.unit = 'kg'; else delete p.unit; delete p.bulto; }
      if (k === 'ropa' && x4 !== '' && !(p.vars && p.vars.length)) p.stock = Math.max(0, Math.round(num(x4)));
      if (k === 'stock'){ p.base = cost; p.extra = 0; if (x4 !== '') p.stock = Math.max(0, Math.round(num(x4))); }
      if (k === 'plato' && x4) p.cat = x4;
      if (k === 'receta'){ delete p.rec; if (x4 !== '') p.lead = Math.round(num(x4)); else if (!(p.lead >= 0)) p.lead = 1; }
      put('products', p);
    }
    if (!add && !upd) return toast(bad ? 'Ninguna línea tiene nombre y precio. Revisa el formato.' : 'Pega la lista primero.');
    cart = []; closeSheet(); render();
    toast(`${add} nuevos, ${upd} actualizados${bad ? ', ' + bad + ' líneas sin precio' : ''}.`);
  },

  ingdel(el){ sheetIngs.splice(+el.dataset.i, 1); $('#ingBox').innerHTML = ingRows(); updateMargin(); },
  saveprod(el){
    const k = feat().form, g = id => { const e = $('#' + id); return e ? e.value.trim() : ''; };
    const name = g('pName'), kg = $('#pUnit').value === 'kg', {cost, price, est} = prodCalc();
    if (!name || !price) return toast('Falta el nombre o el precio de venta.');
    let p = el.dataset.id ? S.products.find(p => p.id === el.dataset.id) : null;
    const st0 = p && tracked(p) ? p.stock : null;
    if (p){ p.name = name; p.cost = cost; p.price = price; delete p.ex; }
    else { p = {id:uid(), name, cost, price}; S.products.push(p); }
    if (kg) p.unit = 'kg'; else delete p.unit;
    if (sheetImg) p.img = sheetImg; else delete p.img;
    if (sheetIco === '-') p.ico = ''; else if (sheetIco) p.ico = sheetIco; else delete p.ico;
    if (est) p.est = true; else delete p.est;
    if (k !== 'stock'){ delete p.base; delete p.extra; }
    if (k === 'bodega'){ const b = num(g('pBulto')), n = num(g('pBultoN')); if (b && n) p.bulto = {c:b, n}; else delete p.bulto; }
    if (k === 'ropa'){
      if (g('pCat')) p.cat = g('pCat'); else delete p.cat;
      const T = splitList(g('pTallas')), C = splitList(g('pColores')), ks = varKeys(T, C);
      p.tallas = T; p.colores = C; p.min = Math.round(num(g('pMin')));
      if (ks.length){ p.vars = ks.map(key => ({k:key, s:Math.max(0, Math.round(num(sheetVars[key])))})); p.stock = p.vars.reduce((t, v) => t + v.s, 0); }
      else { delete p.vars; if (g('pStock') === '') delete p.stock; else p.stock = Math.max(0, Math.round(num(g('pStock')))); }
    }
    if (k === 'stock'){
      p.base = num(g('pCost')); p.extra = num(g('pExtra'));
      if (g('pStock') === '') delete p.stock; else p.stock = Math.max(0, Math.round(num(g('pStock'))));
      p.min = Math.round(num(g('pMin')));
    }
    if (k === 'receta' || k === 'plato'){
      const ings = sheetIngs.filter(x => x.n.trim() || num(x.c)).map(x => ({n:x.n.trim(), c:num(x.c)}));
      if (ings.some(x => x.c > 0)) p.rec = {ings, extra:num(g('pExtra')), rinde:num(g('pRinde')) || 1}; else delete p.rec;
      if (k === 'receta') p.lead = g('pLead') === '' ? 1 : Math.round(num(g('pLead')));
      else {
        if (g('pCat')) p.cat = g('pCat'); else delete p.cat;
        const exs = sheetExs.filter(x => x.n.trim() && num(x.p)).map(x => ({n:x.n.trim(), p:num(x.p)}));
        if (exs.length) p.extras = exs; else delete p.extras;
      }
    }
    if (k !== 'stock' && k !== 'ropa' && $('#pStock')){
      if (g('pStock') === '') delete p.stock; else p.stock = Math.max(0, kg ? r2(num(g('pStock'))) : Math.round(num(g('pStock'))));
      p.min = kg ? r2(num(g('pMin'))) : Math.round(num(g('pMin')));
    }
    if (tracked(p) && st0 !== p.stock) logMove(p, st0 === null ? 'inicio' : 'count', r2(p.stock - (st0 || 0)), st0, p.stock);
    cart = cart.filter(l => l.pid !== p.id);
    put('products', p); closeSheet(); render(); toast('Guardado.');
    if (el.dataset.more) sheetProduct(null);
  },
  delprod(el){
    const p = S.products.find(p => p.id === el.dataset.id); if (!p) return;
    p.off = true; put('products', p); cart = cart.filter(l => l.pid !== p.id); closeSheet(); render();
  },
  delex(){ ask('¿Borrar todos los productos de ejemplo?', 'Borrar ejemplos', () => {
    S.products.filter(p => p.ex).forEach(p => del('products', p.id));
    S.products = S.products.filter(p => !p.ex); cart = cart.filter(l => !l.pid || S.products.some(p => p.id === l.pid)); render(); }); },
  savevm(){
    const v = num($('#vm').value); if (v >= 100) return toast('El margen debe ser menor a 100.');
    S.meta.variosMargin = v; saveMeta(); toast('Margen guardado.');
  },
  async export(){
    const name = 'sacacuenta-' + dayKey(Date.now()) + '.json';
    if (isNative()){
      // dentro del APK: se guarda el archivo y se abre el menú de compartir (WhatsApp, Drive, correo)
      try {
        const {Filesystem, Share} = window.SCNative || window.Capacitor.Plugins;
        const f = await Filesystem.writeFile({path:name, data:backupJSON(), directory:'CACHE', encoding:'utf8'});
        await Share.share({title:'Respaldo de SacaCuenta', url:f.uri});
      } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast('No se pudo compartir. Usa Copiar respaldo.'); }
      return;
    }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([backupJSON()], {type:'application/json'}));
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      toast('Si no se descargó, usa Copiar respaldo.');
    } catch (e) { toast('No se pudo descargar. Usa Copiar respaldo.'); }
  },
  copybk(){
    try { navigator.clipboard.writeText(backupJSON()).then(() => toast('Respaldo copiado. Pégalo en un chat o una nota.'), () => toast('No se pudo copiar.')); }
    catch (e) { toast('No se pudo copiar.'); }
  },
  import(){
    if (CFG.mode !== 'demo' && !lic().paid) return toast('Recuperar desde un archivo se habilita al activar tu cuenta. Tu respaldo en la nube se recupera solo al entrar.');
    const f = $('#bkFile').files[0], t = $('#bkText').value.trim();
    if (!f && !t) return toast('Elige un archivo o pega el respaldo.');
    ask('Recuperar el respaldo reemplaza todo lo que hay ahora en este teléfono.', 'Reemplazar todo', async () => { restore(f ? await f.text() : t); });
  }
};
document.addEventListener('click', e => {
  if (e.target.id === 'overlay'){ dropPay(); return closeSheet(); }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){ query = t.value; renderGrid(); }
  else if (t.id === 'mq'){ mquery = t.value; renderMList(); }
  else if (t.id === 'iq'){ invQ = t.value; renderIList(); }
  else if (t.classList.contains('fxf') || t.classList.contains('fxg')){ if (t.type !== 'checkbox' && t.tagName !== 'SELECT') fxInput(t); }
  else if (t.classList.contains('mx')) updateMix();
  else if (t.classList.contains('wv')) updateWeight();
  else if (t.id === 'icoQ'){ icoQ = t.value; $('#icoBox').innerHTML = icoGrid(); }
  else if (t.classList.contains('vg')) refreshVars();
  else if (t.classList.contains('vs')){ sheetVars[t.dataset.k] = t.value; }
  else if (t.classList.contains('eg')){ sheetExs[+t.dataset.i][t.dataset.f] = t.value; }
  else if (t.classList.contains('ig')){ sheetIngs[+t.dataset.i][t.dataset.f] = t.value; updateMargin(); }
  else if (t.classList.contains('pm')) updateMargin();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'pUnit') return updateMargin();
  if (t.classList.contains('fxf') || t.classList.contains('fxg')){ if (t.type === 'checkbox' || t.tagName === 'SELECT') fxInput(t); return; }
  if ((t.id === 'fxCam' || t.id === 'fxGal') && t.files.length) return fxAddFiles(t.files);
  if (t.id !== 'pImgIn' || !t.files[0]) return;
  try {
    sheetImg = await fileToThumb(t.files[0]);
    $('#pPhoto').innerHTML = photoBox($('#pName').value); $('#pDelPhoto').hidden = false;
  } catch (err) { toast('No se pudo leer esa foto. Prueba con otra.'); }
});

load().then(() => { startCloud(); if (S.meta.rubro) view = homeView(); if (acctState === 'in') { if (!lic().ok) view = 'paywall'; playInit(); } render(true); });
try { if (!isNative() && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
</script>
</body>
